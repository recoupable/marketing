name: Documentation contract inventory
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned API revision
        id: api
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          commit = json.loads(Path('content/docs/contracts/operation-inventory.json').read_text())['apiSourceCommit']
          if not re.fullmatch('[0-9a-f]{40}', commit):
              raise SystemExit('Invalid API commit pin')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + commit + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: recoupable/api
          ref: ${{ steps.api.outputs.commit }}
          path: .contract-api
      - run: python3 scripts/refresh-contract-inventory.py --api .contract-api --check
      - run: python3 scripts/build-contract-examples.py --api .contract-api --check
      - run: python3 scripts/test_sync_legacy_docs.py
      - run: python3 scripts/test_contract_inventory.py
      - run: python3 scripts/test_response_contracts.py
  cli-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the reviewed CLI contract guard
        uses: actions/checkout@v4
        with:
          repository: recoupable/cli
          # CLI #27: compiled-parser checks with non-forwarding synthetic fetch.
          ref: 0965fa9523a42f4af91054b5785bac57e9b327f4
          path: .contract-cli
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .contract-cli/pnpm-lock.yaml
      - name: Build pinned CLI source
        working-directory: .contract-cli
        run: |
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm build
      - name: Verify candidate guide against the compiled CLI
        working-directory: .contract-cli
        env:
          RECOUP_CLI_REFERENCE_PATH: ${{ github.workspace }}/content/docs/source/cli.mdx
        run: pnpm exec vitest run __tests__/publishedCommands.test.ts
