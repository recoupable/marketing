name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Reviewed package version to publish (must match pyproject.toml)'
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check the requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('sdk/python/pyproject.toml').read_text())['project']
          assert os.environ['RELEASE_VERSION'] == project['version'], 'Requested version differs from source'
          PY
      - run: python -m pip install build twine
      - run: python -m build sdk/python --outdir dist
      - run: python -m twine check --strict dist/*
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s sdk/python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/recoupable
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
