[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "recoupable"
version = "0.1.0"
description = "Official Recoup Python client for JSON platform endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Recoup", email = "agent@recoupable.dev" }]
keywords = ["recoup", "recoupable", "music", "api", "sdk"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://recoupable.dev"
Documentation = "https://recoupable.dev/docs"
Source = "https://github.com/recoupable/marketing/tree/main/sdk/python"
Issues = "https://github.com/recoupable/marketing/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/recoupable"]
